name: Android

on:
  push:
    branches: [ main, 'feat/**', 'change/**', 'hotfix/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bplay-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Signed release AAB and APK
    needs: debug
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          echo "UPLOAD_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Release AAB and APK
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bplay-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bplay-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
